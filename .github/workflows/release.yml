name: Release

on:
  push:
    tags:
      - 'v*'

permissions: {}

jobs:
  release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Atlassian Maven repositories
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml << 'SETTINGS'
          <settings>
            <profiles>
              <profile>
                <id>atlassian</id>
                <repositories>
                  <repository>
                    <id>atlassian-all</id>
                    <url>https://packages.atlassian.com/artifactory/maven-atlassian-all/</url>
                  </repository>
                  <repository>
                    <id>terracotta</id>
                    <url>https://repo.terracotta.org/maven2/</url>
                  </repository>
                </repositories>
                <pluginRepositories>
                  <pluginRepository>
                    <id>atlassian-all</id>
                    <url>https://packages.atlassian.com/artifactory/maven-atlassian-all/</url>
                  </pluginRepository>
                </pluginRepositories>
              </profile>
            </profiles>
            <activeProfiles>
              <activeProfile>atlassian</activeProfile>
            </activeProfiles>
          </settings>
          SETTINGS

      - name: Extract version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Read changelog entry
        id: changelog
        uses: mindsers/changelog-reader-action@1faaf50aa09d5793d9a100819973df801febfb31 # v2.4.0
        with:
          version: ${{ steps.version.outputs.version }}
          path: ./CHANGELOG.md
          validation_level: warn

      - name: Set release version from tag
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: mvn versions:set -DnewVersion="$RELEASE_VERSION" -B

      - name: Build
        run: mvn package -DskipTests -B

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          RELEASE_NOTES: ${{ steps.changelog.outputs.changes }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "v$RELEASE_VERSION" \
            --notes "$RELEASE_NOTES" \
            --latest \
            target/confluence-mcp-plugin-*.jar \
            target/confluence-mcp-plugin-*.obr
